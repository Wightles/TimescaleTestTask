services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timescale_api
      POSTGRES_USER: timescale_user
      POSTGRES_PASSWORD: timescale_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale_user -d timescale_api"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  timescaleapi:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=timescale_api;Username=timescale_user;Password=timescale_password
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
